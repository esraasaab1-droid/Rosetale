<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rose Tale | Store</title>
    <meta name="description" content="Rose Tale Flower Store">
    <link rel="stylesheet" href="style.css" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header class="main-header main-header--small">
        <nav class="main-nav nav">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="store.html" class="active">STORE</a></li>
                <li><a href="about.html">ABOUT</a></li>
            </ul>
        </nav>
        <h1 class="band-name band-name-large">Rose <em>Tale</em></h1>
    </header>

    <section class="container content-section">
        <p class="section-eyebrow">Our Collection</p>
        <h2 class="section-header">Soft Petals</h2>
        <div class="shop-items">
            <div class="shop-item">
                <span class="shop-item-title">Yasmen</span>
                <img class="shop-item-image" src="Images/flower2.jpg" alt="Yasmen">
                <div class="shop-item-details">
                    <span class="shop-item-price">$12.99</span>
                    <button class="btn btn-primary shop-item-button" type="button">ADD TO CART</button>
                </div>
            </div>
            <div class="shop-item">
                <span class="shop-item-title">Tulib</span>
                <img class="shop-item-image" src="Images/flower3.jpg" alt="Tulib">
                <div class="shop-item-details">
                    <span class="shop-item-price">$14.99</span>
                    <button class="btn btn-primary shop-item-button" type="button">ADD TO CART</button>
                </div>
            </div>
            <div class="shop-item">
                <span class="shop-item-title">Lily</span>
                <img class="shop-item-image" src="Images/flower4.jpg" alt="Lily">
                <div class="shop-item-details">
                    <span class="shop-item-price">$9.99</span>
                    <button class="btn btn-primary shop-item-button" type="button">ADD TO CART</button>
                </div>
            </div>
            <div class="shop-item">
                <span class="shop-item-title">Sun Flower</span>
                <img class="shop-item-image" src="Images/flower5.jpg" alt="Sun Flower">
                <div class="shop-item-details">
                    <span class="shop-item-price">$19.99</span>
                    <button class="btn btn-primary shop-item-button" type="button">ADD TO CART</button>
                </div>
            </div>
        </div>
    </section>

    <section class="container content-section">
        <h2 class="section-header">Eternal Love Bouquet</h2>
        <div class="shop-items">
            <div class="shop-item">
                <span class="shop-item-title">Orchid</span>
                <img class="shop-item-image" src="Images/flower9.jpg" alt="Orchid">
                <div class="shop-item-details">
                    <span class="shop-item-price">$19.99</span>
                    <button class="btn btn-primary shop-item-button" type="button">ADD TO CART</button>
                </div>
            </div>
            <div class="shop-item">
                <span class="shop-item-title">Rose Damas</span>
                <img class="shop-item-image" src="Images/flower7.jpg" alt="Rose Damas">
                <div class="shop-item-details">
                    <span class="shop-item-price">$6.99</span>
                    <button class="btn btn-primary shop-item-button" type="button">ADD TO CART</button>
                </div>
            </div>
        </div>
    </section>

    <section class="container content-section">
        <p class="section-eyebrow">Your Selection</p>
        <h2 class="section-header">CART</h2>
        <div class="cart-row">
            <span class="cart-item cart-header cart-column">ITEM</span>
            <span class="cart-price cart-header cart-column">PRICE</span>
            <span class="cart-quantity cart-header cart-column">QUANTITY</span>
        </div>
        <div class="cart-items"></div>
        <div class="cart-total">
            <strong class="cart-total-title">Total</strong>
            <span class="cart-total-price">$0</span>
        </div>
        <button class="btn btn-primary btn-purchase" type="button">PURCHASE</button>
    </section>

    <footer class="main-footer">
        <div class="container main-footer-container">
            <h3 class="band-name footer-brand">Rose Tale</h3>
            <ul class="nav footer-nav">
                <li><a href="https://www.youtube.com" target="_blank">YouTube</a></li>
                <li><a href="https://www.spotify.com" target="_blank">Spotify</a></li>
                <li><a href="https://www.facebook.com" target="_blank">Facebook</a></li>
            </ul>
        </div>
    </footer>
        <script src="script.js" async></script>

</body>
</html>
